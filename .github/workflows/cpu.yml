name: CPU references and research artifact integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q -x 'build|upstream' .
      - run: python verify_records.py
      - run: python prepare_consumer.py build/FlashProve
      - run: verifier/build.sh
        working-directory: build/FlashProve
      - run: python cpu_study.py build/FlashProve --output build/ci-verifier.json
      - run: python verify_artifacts.py build/FlashProve --output build/ci-public-proofs.json
      - run: python generate_report.py
      - run: python verify_followups.py
      - run: git diff --exit-code -- results/followup-summary.csv results/proofs-summary.csv results/report-provenance.json RESULTS.md FINAL_REPORT.md
